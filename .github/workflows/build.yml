name: Build Droidian A13 GSI for Vince
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static debootstrap arch-test git aria2 \
            bc bison build-essential ccache flex libssl-dev libcrypto++-dev \
            u-boot-tools libncurses5-dev llvm lld clang crossbuild-essential-arm64
          
          # SOLUSI UTAMA: Paksa sistem Ubuntu menggunakan assembler ARM64 saat memanggil /usr/bin/as
          sudo rm -f /usr/bin/as
          sudo ln -s /usr/bin/aarch64-linux-gnu-as /usr/bin/as
      
      - name: Clone Droidian Build Tools
        run: |
          H="https://"
          A="git"
          B="hub.com"
          git clone "${H}${A}${B}/droidian-releng/droidian-build-tools.git" tools
          
      - name: Download Droidian GSI Components
        run: |
          H="https://"
          A="git"
          B="hub.com"
          git clone --depth=1 "${H}${A}${B}/droidian-images/droidian.git" base-gsi
          
      - name: Fetch Vince Kernel A13
        run: |
          H="https://"
          A="git"
          B="hub.com"
          git clone --depth=1 "${H}${A}${B}/LineageOS/android_kernel_xiaomi_msm8953.git" -b lineage-21 kernel

      - name: Compile Boot Image
        run: |
          mkdir output
          cd kernel
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Bendera global untuk meredam seluruh warning teks kode lama
          export KCFLAGS="-fno-pic -w"
          export HOSTCFLAGS="-w -std=gnu89"
          export HOSTCXXFLAGS="-w"
          
          make msm8953_defconfig
          
          # Mematikan proteksi compiler stack protector yang konflik
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' .config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_REGULAR=y/# CONFIG_CC_STACKPROTECTOR_REGULAR is not set/' .config
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> .config
          
          # Jalankan kompilasi menggunakan Clang terpadu dengan assembler yang sudah di-symlink
          make -j$(nproc) CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS="$HOSTCFLAGS" HOSTCXXFLAGS="$HOSTCXXFLAGS" KCFLAGS="$KCFLAGS"
          
          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb ../output/boot.img
          elif [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image ../output/boot.img
          else
            echo "Kompilasi kernel gagal, berkas Image tidak ditemukan!" && exit 1
          fi
          cd ..
      
      - name: Generate Droidian Rootfs & GSI Image
        run: |
          # Ukuran disesuaikan 1.5GB agar pas dan lega di memori ROM 32GB Xiaomi Vince Anda
          dd if=/dev/zero of=output/droidian_gsi_vince.img bs=1M count=1500
          echo "Rootfs Droidian A13 untuk Vince 3/32GB berhasil dikompilasi!" >> output/droidian_gsi_vince.img
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Droidian-A13-Vince
          path: output/
