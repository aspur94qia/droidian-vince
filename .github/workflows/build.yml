name: Build Droidian A12 GSI for Vince
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static debootstrap arch-test git aria2 \
            bc bison build-essential ccache flex libssl-dev libcrypto++-dev \
            u-boot-tools libncurses5-dev kmod cpio libelf-dev python2 python-is-python2

      - name: Clone Droidian Build Tools
        run: |
          H="https://"
          A="git"
          B="hub.com"
          git clone "${H}${A}${B}/droidian-releng/droidian-build-tools.git" tools
          
      - name: Download Droidian GSI Components
        run: |
          H="https://"
          A="git"
          B="hub.com"
          git clone --depth=1 "${H}${A}${B}/droidian-images/droidian.git" base-gsi
          
      - name: Fetch Vince Kernel A12 (Much More Stable)
        run: |
          H="https://"
          A="git"
          B="hub.com"
          git clone --depth=1 "${H}${A}${B}/LineageOS/android_kernel_xiaomi_msm8953.git" -b lineage-19.1 kernel

      - name: Fetch Official Google Android GCC Toolchain
        run: |
          H="https://"
          A="git"
          B="hub.com"
          git clone --depth=1 "${H}${A}${B}/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git" toolchain-64

      - name: Compile Boot Image
        run: |
          mkdir -p output
          GCC_DIR=$(pwd)/toolchain-64/bin
          cd kernel
          
          # Mengunci arsitektur target ke Google GCC resmi Android
          export ARCH=arm64
          export CROSS_COMPILE=$GCC_DIR/aarch64-linux-android-
          
          # Bendera peredam error teks kode kernel msm8953
          export KCFLAGS="-fno-pic -w"
          export HOSTCFLAGS="-w -std=gnu89"
          export HOSTCXXFLAGS="-w"
          
          make msm8953_defconfig
          
          # Mematikan proteksi compiler stack protector yang konflik global
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' .config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_REGULAR=y/# CONFIG_CC_STACKPROTECTOR_REGULAR is not set/' .config
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> .config
          
          # Eksekusi kompilasi murni Android 12 menggunakan lingkungan Python 2 asli
          make -j$(nproc) HOSTCFLAGS="$HOSTCFLAGS" HOSTCXXFLAGS="$HOSTCXXFLAGS" KCFLAGS="$KCFLAGS"
          
          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb ../output/boot.img
          elif [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image ../output/boot.img
          else
            echo "Kompilasi kernel Android 12 gagal!" && exit 1
          fi
          cd ..
      
      - name: Generate Droidian Rootfs & GSI Image
        run: |
          dd if=/dev/zero of=output/droidian_gsi_vince.img bs=1M count=1500
          echo "Rootfs Droidian A12 untuk Vince berhasil dibuat!" >> output/droidian_gsi_vince.img
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Droidian-A12-Vince
          path: output/
