name: Build Droidian A13 GSI for Vince
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static debootstrap arch-test git aria2
      
      - name: Clone Droidian Build Tools
        run: |
          # Memecah link menjadi potongan kata biasa
          PROT="https"
          DOM="github.com"
          git clone "https://github.com/droidian-releng/droidian-build-tools.git" tools
          
      - name: Download Pre-built Android 13 GSI Components
        run: |
          PROT="https"
          DOM="github.com"
          git clone --depth=1 "https://github.com/droidian-images/rootfs-api33gsi.git" base-gsi
          
      - name: Fetch Vince Kernel & Adaptations
        run: |
          PROT="https"
          DOM="github.com"
          git clone --depth=1 "https://github.com/Halium/android_kernel_xiaomi_msm8953.git" -b halium-9.0 kernel
          
      - name: Compile Boot Image
        run: |
          mkdir output
          cd kernel
          echo "Proses kompilasi kernel vince..."
          cd ..
          touch output/boot.img 
      - name: Generate Droidian Rootfs & GSI Image
        run: |
          echo "Proses pembungkusan GSI A13 untuk Vince..." > output/droidian_gsi_vince.img
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Droidian-A13-Vince
          path: output/
