name: Build Compact Droidian Installer ZIP for Vince
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git aria2 zip unzip gzip

      - name: Fetch and Assemble Compact Installer Components
        run: |
          mkdir -p output
          mkdir -p tmp_workspace
          
          H="https://"
          A="git"
          B="hub.com"
          
          # =========================================================================
          # LANGKAH 1: UNDUH FILE UTAMA UBPORTS VINCE ASLI
          # =========================================================================
          echo "Mengunduh berkas installer UBports Vince asli..."
          aria2c -s 16 -x 16 -k 1M -o output/Droidian-Vince-Hybrid-Installer.zip \
            "${H}${A}${B}/ubports-on-vince/ubports-ci/releases/download/refs%2Fheads%2Fmaster/ubports-20220121-015528-devel-vince.zip"
          
          # Hapus HANYA rootfs.img.gz bawaan asli dari dalam wadah ZIP
          echo "Menghapus HANYA berkas rootfs.img.gz bawaan UBports lama..."
          zip -d output/Droidian-Vince-Hybrid-Installer.zip rootfs.img.gz || true

          # =========================================================================
          # LANGKAH 2: UNDUH FILE DROIDIAN, EKSTRAK ROOTFS.IMG, LALU UBAH JADI GZ
          # =========================================================================
          echo "Mengunduh Berkas Sistem Droidian Pilihan Anda..."
          aria2c -s 16 -x 16 -k 1M -o droidian_source.zip \
            "${H}${A}${B}/droidian-images/droidian/releases/download/droidian%2F101.20251130/droidian-OFFICIAL-phosh-phone-rootfs-api29-arm64-101.20251130_20251207.zip"
          
          # Ekstrak langsung file citra utama dari dalam ZIP Droidian ke tmp_workspace
          unzip -j droidian_source.zip "*.img" -d tmp_workspace/
          rm -f droidian_source.zip
          
          # FIX: Perintah mv ganda yang bikin eror kemarin sudah dihapus total di sini!
          # File hasil unzip sudah otomatis bernama rootfs.img, jadi langsung kita gzip
          echo "Mengompresi rootfs.img milik Droidian menjadi format .gz..."
          gzip -9 tmp_workspace/rootfs.img
          
          # =========================================================================
          # LANGKAH 3: MASUKKAN ROOTFS.IMG.GZ DROIDIAN BARU KE FILE UBPORTS.ZIP
          # =========================================================================
          echo "Menyuntikkan rootfs.img.gz baru ke dalam wadah ZIP asli..."
          cd tmp_workspace
          zip -9ur ../output/Droidian-Vince-Hybrid-Installer.zip rootfs.img.gz
          cd ..
          
          # Bersihkan sisa ruang temporary
          rm -rf tmp_workspace
          echo "Proses tukar guling rootfs sukses tanpa eror bos!"
      
      - name: Upload Finished Installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Droidian-Hybrid-ZIP-Vince
          path: output/
