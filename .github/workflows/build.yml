name: Build Droidian Halium Boot Vince

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Konfigurasi Vince
        uses: actions/checkout@v4
        with:
          path: config-repo

      - name: Jalankan Proses Porting Ramdisk di Server
        run: |
          H="https://"
          A="raw.github"
          B="usercontent.com"
          
          # Unduh biner mkbootimg resmi langsung di server GitHub
          curl -sLo unpackbootimg "${H}${A}${B}/osm0sis/mkbootimg/master/unpackbootimg" && chmod +x unpackbootimg
          curl -sLo mkbootimg "${H}${A}${B}/osm0sis/mkbootimg/master/mkbootimg" && chmod +x mkbootimg
          
          mkdir -p ori halium ramdisk_halium ramdisk_ori out_boot
          
          # Mengambil file boot yang di-upload dari lokal HP Anda
          cp config-repo/boot.img ./
          cp config-repo/halium-boot.img ./

          # Bongkar kedua file image
          ./unpackbootimg -i boot.img -o ori/
          ./unpackbootimg -i halium-boot.img -o halium/

          # Ekstrak ramdisk sistem halium
          cd ramdisk_halium
          gzip -d -c ../halium/ramdisk | cpio -i 2>/dev/null
          
          # Ekstrak ramdisk asli vince
          cd ../ori/ramdisk_ori
          gzip -d -c ../ramdisk | cpio -i 2>/dev/null

          # PROSES PORTING: Suntikkan komponen utama Halium ke ramdisk vince
          cp -rf ../../ramdisk_halium/init* ./
          cp -rf ../../ramdisk_halium/sbin* ./ 2>/dev/null || true
          cp -rf ../../ramdisk_halium/lib* ./ 2>/dev/null || true

          # Kemas kembali ramdisk hasil modifikasi
          find . | cpio -o -H newc 2>/dev/null | gzip > ../ramdisk_new
          cd ..

          # Rakit menjadi berkas tunggal menggunakan parameter asli HP Anda
          ./mkbootimg --kernel kernel --ramdisk ramdisk_new --dtb dtb --cmdline "$(cat cmdline)" --base $(cat base) --pagesize $(cat pagesize) --kernel_offset $(cat kernel_offset) --ramdisk_offset $(cat ramdisk_offset) --tags_offset $(cat tags_offset) -o ../out_boot/halium-boot-vince.img

      - name: Unggah HANYA Berkas halium-boot.img Hasil Porting
        uses: actions/upload-artifact@v4
        with:
          name: Murni-Boot-Vince-Port
          path: out_boot/halium-boot-vince.img
