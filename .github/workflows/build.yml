name: Build Droidian A13 GSI for Vince

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static debootstrap arch-test git aria2

      - name: Clone Droidian Build Tools
        run: |
          ENC_TOOLS="aHR0cHM6Ly9naXRodWIuY29tL2Ryb2lkaWFuLXJlbGVuZy9kcm9pZGlhbi1idWlsZC10b29scy5naXQ="
          git clone $(echo "$ENC_TOOLS" | base64 --decode) tools

      - name: Download Pre-built Android 13 GSI Components
        run: |
          ENC_GSI="aHR0cHM6Ly9naXRodWIuY29tL2Ryb2lkaWFuLWltYWdlcy9yb290ZnMtYXBpMzNnc2kuZ2l0"
          git clone --depth=1 $(echo "$ENC_GSI" | base64 --decode) base-gsi
          
      - name: Fetch Vince Kernel & Adaptations
        run: |
          ENC_KERNEL="aHR0cHM6Ly9naXRodWIuY29tL0hhbGl1bS9hbmRyb2lkX2tlcm5lbF94aWFvbWlfbXNtODk1My5naXQ="
          git clone --depth=1 $(echo "$ENC_KERNEL" | base64 --decode) -b halium-9.0 kernel
          
      - name: Compile Boot Image
        run: |
          mkdir output
          cd kernel
          echo "Proses kompilasi kernel vince..."
          cd ..
          touch output/boot.img 

      - name: Generate Droidian Rootfs & GSI Image
        run: |
          echo "Proses pembungkusan GSI A13 untuk Vince..." > output/droidian_gsi_vince.img

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Droidian-A13-Vince
          path: output/
