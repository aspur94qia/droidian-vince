name: Build Genuine Droidian Rootfs for Vince
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static debootstrap arch-test git aria2 \
            zstd android-sdk-libsparse-utils e2fsprogs
      
      - name: Clone Droidian Developer Tools
        run: |
          git clone https://github.com tools
          
      - name: Build Authentic Droidian System Image
        run: |
          mkdir -p output
          
          # Membuat rootfs Droidian (Debian Bookworm) murni untuk arsitektur ARM64
          sudo ./tools/developer/droidian-build-rootfs \
            --architecture arm64 \
            --distribution bookworm \
            --output output/droidian_gsi_vince.img \
            --size 2000M
            
          # Memastikan file sistem berhasil dibuat dan bukan berukuran 0 bytes
          if [ ! -s output/droidian_gsi_vince.img ]; then
            echo "Gagal membangun Rootfs Droidian asli!" && exit 1
          fi
      
      - name: Upload Droidian System Image
        uses: actions/upload-artifact@v4
        with:
          name: Droidian-Rootfs-Vince
          path: output/
