name: Build Compact Droidian Installer ZIP for Vince
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git aria2 zip unzip

      - name: Fetch and Assemble Compact Installer Components
        run: |
          mkdir -p output
          
          # Mengunci format pemisah string anti-blokir asli milik Anda
          H="https://"
          A="git"
          B="hub.com"
          
          # =========================================================================
          # LANGKAH 1: UNDUH FILE UTAMA UBPORTS VINCE ASLI (SEBAGAI WADAH UTAMA)
          # =========================================================================
          echo "Mengunduh berkas installer UBports Vince asli..."
          aria2c -s 16 -x 16 -k 1M -o output/Droidian-Vince-Hybrid-Installer.zip \
            "${H}${A}${B}/ubports-on-vince/ubports-ci/releases/download/refs%2Fheads%2Fmaster/ubports-20220121-015528-devel-vince.zip"
          
          # =========================================================================
          # LANGKAH 2: UNDUH OS DROIDIAN RESMI DAN EKSTRAK BERKAS ROOTFS ASLINYA
          # =========================================================================
          echo "Mengunduh Berkas Sistem Droidian Resmi API29 Pilihan Anda..."
          aria2c -s 16 -x 16 -k 1M -o droidian_source.zip \
            "${H}${A}${B}/droidian-images/droidian/releases/download/droidian%2F101.20251130/droidian-OFFICIAL-phosh-phone-rootfs-api29-arm64-101.20251130_20251207.zip"
          
          # Ekstrak file .img sistem dari ZIP Droidian langsung ke folder kerja sementara
          mkdir -p tmp_droidian
          unzip -j droidian_source.zip "*.img" -d tmp_droidian/
          
          # =========================================================================
          # LANGKAH 3: SUNTIKKAN BERKAS DROIDIAN KE DALAM ZIP ASLI UBPORTS (FIXED)
          # =========================================================================
          echo "Menyuntikkan sistem Droidian ke dalam ZIP asli UBports..."
          
          # Masuk ke folder sementara dan perbarui berkas rootfs.img di dalam ZIP utama
          # Menghapus perintah mv duplikat karena file sudah otomatis bernama rootfs.img
          cd tmp_droidian
          zip -u ../output/Droidian-Vince-Hybrid-Installer.zip rootfs.img
          cd ..
          
          # Bersihkan sisa berkas temporary
          rm -rf tmp_droidian droidian_source.zip
          echo "Proses penggabungan hibrida selesai sempurna!"
      
      - name: Upload Finished Installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Droidian-Hybrid-ZIP-Vince
          path: output/
