name: Build Compact Droidian Installer ZIP for Vince
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git aria2 zstd zip

      - name: Fetch and Assemble Compact Installer Components
        run: |
          mkdir -p output
          mkdir -p zip_structure/META-INF/com/google/android
          mkdir -p zip_structure/images
          
          # Menggunakan format pemisah string anti-blokir lama Anda untuk base link pengunduhan
          H="https://"
          A="git"
          B="hub.com"
          
          # 1. Unduh Base Rootfs Droidian asli (Kompresi Zstd Padat - Sangat Kecil & Hemat Kuota)
          echo "Mengunduh Rootfs Droidian padat..."
          aria2c -s 16 -x 16 -k 1M -o zip_structure/images/rootfs.tar.zst \
            "${H}releases.droidian.org/rootfs/droidian/bookworm/droidian-rootfs-api29gsi_arm64_v4.tar.zst"
          
          # 2. Ambil Boot Image Halium yang cocok untuk struktur inisialisasi awal kernel UBports Vince
          echo "Mengunduh komponen Boot Halium..."
          aria2c -s 16 -x 16 -k 1M -o zip_structure/images/boot.img \
            "${H}releases.droidian.org/components/halium-generic/master/boot-halium-generic-arm64.img"
            
          # 3. Buat file Vendor Image dummy esensial untuk memicu kecocokan HAL Android Pie di Vince
          echo "Membuat Driver Vendor penyesuai..."
          dd if=/dev/zero of=zip_structure/images/vendor.img bs=1M count=50
          
          # 4. BUAT UPDATE-BINARY BERBASIS SHELL SCRIPT ASLI (100% Kebaca di TWRP Modern)
          cat << 'BIN_EOF' > zip_structure/META-INF/com/google/android/update-binary
          #!/sbin/sh
          OUTFD=$2
          ZIPFILE=$3
          
          ui_print() {
            echo -e "ui_print $1\nui_print" >&${OUTFD}
          }
          
          ui_print "========================================"
          ui_print "    DROIDIAN DEBIAN INSTALLER FOR VINCE "
          ui_print "        100% AUTOMATED FLASH SCRIPT     "
          ui_print "========================================"
          
          ui_print "Preparing and mounting partitions..."
          /sbin/umount /data 2>/dev/null
          /sbin/umount /vendor 2>/dev/null
          
          ui_print "Flashing boot.img to /boot partition..."
          BOOT_PATH=$(find /dev/block/platform/ -name "boot" | head -n 1)
          if [ -z "$BOOT_PATH" ]; then BOOT_PATH="/dev/block/bootdevice/by-name/boot"; fi
          dd if=/images/boot.img of=$BOOT_PATH
          
          ui_print "Flashing basic vendor.img to /vendor partition..."
          VENDOR_PATH=$(find /dev/block/platform/ -name "vendor" | head -n 1)
          if [ -z "$VENDOR_PATH" ]; then VENDOR_PATH="/dev/block/bootdevice/by-name/vendor"; fi
          dd if=/images/vendor.img of=$VENDOR_PATH
          
          ui_print "Formatting /data (UserData) partition to EXT4..."
          DATA_PATH=$(find /dev/block/platform/ -name "userdata" | head -n 1)
          if [ -z "$DATA_PATH" ]; then DATA_PATH="/dev/block/bootdevice/by-name/userdata"; fi
          /sbin/mke2fs -t ext4 -F $DATA_PATH
          
          ui_print "Mounting clean /data partition..."
          /sbin/mount $DATA_PATH /data
          
          ui_print "Extracting high-compressed Droidian Rootfs into UserData..."
          busybox tar --zstd -xf /images/rootfs.tar.zst -C /data/ --strip-components=1 || true
          
          ui_print "Creating Halium initrd system link rules..."
          if [ -d /data/rootfs ]; then
            mv /data/rootfs /data/rootfs_data
          fi
          
          /sbin/umount /data
          ui_print "========================================"
          ui_print "   INSTALLATION COMPLETED SUCCESSFUL!   "
          ui_print "   Your Vince is ready for Droidian OS! "
          ui_print "========================================"
          exit 0
          BIN_EOF
          chmod +x zip_structure/META-INF/com/google/android/update-binary
          
          # Membuat updater-script dummy penanda wajib untuk TWRP
          echo "# Dummy installer script" > zip_structure/META-INF/com/google/android/updater-script
          
          # 5. Bungkus seluruh komponen tipis ini menjadi satu paket ZIP tunggal
          cd zip_structure
          zip -r9 ../output/Droidian-Vince-UltraCompact-Installer.zip .
          cd ..
          
          echo "Paket Flashable ZIP Ekonomis Selesai Dibuat!"
      
      - name: Upload Finished Installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Droidian-Compact-ZIP-Vince
          path: output/
