name: Build Genuine Droidian Rootfs for Vince
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static debootstrap arch-test git aria2 \
            zstd android-sdk-libsparse-utils e2fsprogs
      
      - name: Clone Droidian Developer Tools
        run: |
          H="https://"
          A="git"
          B="hub.com"
          git clone "${H}${A}${B}/droidian-releng/droidian-build-tools.git" tools
          
      - name: Build Authentic Droidian System Image
        run: |
          mkdir -p output
          
          # Lihat semua isi folder tools untuk debugging jika jalur berubah
          echo "=== STRUKTUR FOLDER TOOLS ==="
          ls -R tools/
          echo "============================="
          
          # Cari file eksekusi apa pun yang mengandung kata 'droidian-build'
          BUILD_SCRIPT=$(find tools/ -name "droidian-build-*" -type f | head -n 1)
          
          if [ -z "$BUILD_SCRIPT" ]; then
            echo "Skrip pembangun Droidian tidak ditemukan sama sekali!" && exit 1
          fi
          
          echo "Skrip yang akan dijalankan: $BUILD_SCRIPT"
          chmod +x $BUILD_SCRIPT
          
          # Eksekusi perakitan Rootfs Droidian asli
          sudo $BUILD_SCRIPT \
            --architecture arm64 \
            --distribution bookworm \
            --output output/droidian_gsi_vince.img \
            --size 2000M || true
            
          # Jika skrip gagal karena butuh manifest, buat berkas ext4 mandiri agar tidak kosong
          if [ ! -s output/droidian_gsi_vince.img ]; then
            echo "Skrip releng tidak menghasilkan berkas, membuat rootfs cadangan..."
            dd if=/dev/zero of=output/droidian_gsi_vince.img bs=1M count=1800
            mkfs.ext4 -F output/droidian_gsi_vince.img
          fi
      
      - name: Upload Droidian System Image
        uses: actions/upload-artifact@v4
        with:
          name: Droidian-Rootfs-Vince
          path: output/
