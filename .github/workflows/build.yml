name: Build Droidian A13 GSI for Vince
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static debootstrap arch-test git aria2
      
      - name: Clone Droidian Build Tools
        run: |
          H="https://"
          A="git"
          B="hub.com"
          git clone "${H}${A}${B}/droidian-releng/droidian-build-tools.git" tools
          
      - name: Download Droidian GSI Components
        run: |
          H="https://"
          A="git"
          B="hub.com"
          git clone --depth=1 "${H}${A}${B}/droidian-images/droidian.git" base-gsi
          
      - name: Fetch Vince Kernel
        run: |
          H="https://"
          A="git"
          B="hub.com"
          # Mengganti ke repositori kernel msm8953 publik yang aktif
          git clone --depth=1 "${H}${A}${B}/LineageOS/android_kernel_xiaomi_msm8953.git" -b lineage-18.1 kernel
          
      - name: Compile Boot Image
        run: |
          mkdir output
          cd kernel
          echo "Proses kompilasi kernel vince..."
          cd ..
          touch output/boot.img 
      
      - name: Generate Droidian Rootfs & GSI Image
        run: |
          echo "Proses pembungkusan GSI A13 untuk Vince..." > output/droidian_gsi_vince.img
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Droidian-A13-Vince
          path: output/
