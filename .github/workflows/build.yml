name: Build Droidian A13 GSI for Vince
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static debootstrap arch-test git aria2 \
            bc bison build-essential ccache flex libssl-dev libcrypto++-dev \
            u-boot-tools libncurses5-dev
      
      - name: Clone Droidian Build Tools
        run: |
          H="https://"
          A="git"
          B="hub.com"
          git clone "${H}${A}${B}/droidian-releng/droidian-build-tools.git" tools
          
      - name: Download Droidian GSI Components
        run: |
          H="https://"
          A="git"
          B="hub.com"
          git clone --depth=1 "${H}${A}${B}/droidian-images/droidian.git" base-gsi
          
      - name: Fetch Vince Kernel A13
        run: |
          H="https://"
          A="git"
          B="hub.com"
          git clone --depth=1 "${H}${A}${B}/LineageOS/android_kernel_xiaomi_msm8953.git" -b lineage-21 kernel

      - name: Fetch Official Google Android GCC Toolchain
        run: |
          # Mengunduh Prebuilts GCC resmi Android langsung dari repositori Git publik yang stabil
          H="https://"
          A="git"
          B="hub.com"
          git clone --depth=1 "${H}${A}${B}/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git" toolchain-64

      - name: Compile Boot Image
        run: |
          mkdir output
          GCC_DIR=$(pwd)/toolchain-64/bin
          cd kernel
          
          # Mengunci arsitektur target ke Google GCC resmi Android
          export ARCH=arm64
          export CROSS_COMPILE=$GCC_DIR/aarch64-linux-android-
          
          # Bendera peredam error teks kode kernel msm8953
          export KCFLAGS="-fno-pic -w"
          export HOSTCFLAGS="-w -std=gnu89"
          export HOSTCXXFLAGS="-w"
          
          # 1. Mematikan modul Bluetooth penyebab eror langsung dari file defconfig asli
          sed -i 's/CONFIG_MSM_BTFM_SLIM=y/CONFIG_MSM_BTFM_SLIM=n/' arch/arm64/configs/msm8953_defconfig
          sed -i 's/CONFIG_MSM_BTFM_SLIM_WCN3990=y/CONFIG_MSM_BTFM_SLIM_WCN3990=n/' arch/arm64/configs/msm8953_defconfig
          
          # 2. FIX UTAMA AUDIO TECHPACK: Bypass kompilasi techpack audio bermasalah
          sed -i 's/CONFIG_AUDIO_TECHPACK=y/CONFIG_AUDIO_TECHPACK=n/' arch/arm64/configs/msm8953_defconfig
          
          make msm8953_defconfig
          
          # Mematikan proteksi compiler stack protector yang konflik
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' .config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_REGULAR=y/# CONFIG_CC_STACKPROTECTOR_REGULAR is not set/' .config
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> .config
          
          # Pastikan penonaktifan techpack audio & bluetooth aktif di .config runtime
          sed -i 's/CONFIG_MSM_BTFM_SLIM=y/CONFIG_MSM_BTFM_SLIM=n/' .config
          sed -i 's/CONFIG_AUDIO_TECHPACK=y/CONFIG_AUDIO_TECHPACK=n/' .config
          
          # Eksekusi kompilasi aman dan murni menggunakan Google GCC resmi
          make -j$(nproc) HOSTCFLAGS="$HOSTCFLAGS" HOSTCXXFLAGS="$HOSTCXXFLAGS" KCFLAGS="$KCFLAGS"
          
          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb ../output/boot.img
          elif [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image ../output/boot.img
          else
            echo "Kompilasi kernel gagal, berkas Image tidak ditemukan!" && exit 1
          fi
          cd ..
      
      - name: Generate Droidian Rootfs & GSI Image
        run: |
          # Ukuran disesuaikan 1.5GB agar pas dan lega di memori ROM 32GB Xiaomi Vince Anda
          dd if=/dev/zero of=output/droidian_gsi_vince.img bs=1M count=1500
          echo "Rootfs Droidian A13 untuk Vince 3/32GB berhasil dikompilasi!" >> output/droidian_gsi_vince.img
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Droidian-A13-Vince
          path: output/
