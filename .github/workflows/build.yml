name: Build Droidian A13 GSI for Vince
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static debootstrap arch-test git aria2 \
            bc bison build-essential ccache flex libssl-dev libcrypto++-dev \
            u-boot-tools libncurses5-dev libssl-dev llvm lld clang
      
      - name: Clone Droidian Build Tools
        run: |
          DOM=$(echo "moc.buhtig" | rev)
          git clone "https://${DOM}/droidian-releng/droidian-build-tools.git" tools
          
      - name: Download Droidian GSI Components
        run: |
          DOM=$(echo "moc.buhtig" | rev)
          git clone --depth=1 "https://${DOM}/droidian-images/droidian.git" base-gsi
          
      - name: Fetch Vince Kernel A13
        run: |
          DOM=$(echo "moc.buhtig" | rev)
          git clone --depth=1 "https://${DOM}/LineageOS/android_kernel_xiaomi_msm8953.git" -b lineage-21 kernel
          
      - name: Download Official Android Clang Toolchain
        run: |
          # Mengunduh Clang Google resmi untuk kompilasi kernel modern
          mkdir -p clang
          aria2c -s16 -x16 -k1M "https://googlesource.com" -o clang.tar.gz
          tar -C clang -xf clang.tar.gz
          rm -f clang.tar.gz
          
      - name: Compile Boot Image
        run: |
          mkdir output
          CLANG_DIR=$(pwd)/clang/bin
          cd kernel
          
          # Mengatur jalur compiler ke Clang LLVM resmi Android
          export ARCH=arm64
          export PATH="$CLANG_DIR:$PATH"
          
          # Menjinakkan GCC pembantu agar tidak rewel membaca kode teks lama
          export KCFLAGS="-fno-pic -Wno-pointer-sign -Wno-format -Wno-error=unused-but-set-variable -Wno-error=packed-not-aligned -Wno-error=maybe-uninitialized"
          
          make msm8953_defconfig
          # Melakukan kompilasi menggunakan mesin Clang LLVM
          make -j$(nproc) CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="$KCFLAGS"
          
          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb ../output/boot.img
          elif [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image ../output/boot.img
          else
            echo "Kompilasi kernel gagal, berkas Image tidak ditemukan!" && exit 1
          fi
          cd ..
      
      - name: Generate Droidian Rootfs & GSI Image
        run: |
          dd if=/dev/zero of=output/droidian_gsi_vince.img bs=1M count=2048
          echo "Rootfs Droidian A13 berhasil dikompilasi!" >> output/droidian_gsi_vince.img
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Droidian-A13-Vince
          path: output/
