name: Build Compact Droidian Installer ZIP for Vince
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git aria2 zip unzip gzip

      - name: Fetch and Assemble Compact Installer Components
        run: |
          mkdir -p output
          mkdir -p tmp_workspace
          
          H="https://"
          A="git"
          B="hub.com"
          
          # =========================================================================
          # LANGKAH 1: UNDUH FILE UTAMA UBPORTS VINCE ASLI
          # =========================================================================
          echo "Mengunduh berkas installer UBports Vince asli..."
          aria2c -s 16 -x 16 -k 1M -o output/Droidian-Vince-Hybrid-Installer.zip \
            "${H}${A}${B}/ubports-on-vince/ubports-ci/releases/download/refs%2Fheads%2Fmaster/ubports-20220121-015528-devel-vince.zip"
          
          echo "Membersihkan file sistem lama di dalam ZIP wadah..."
          zip -d output/Droidian-Vince-Hybrid-Installer.zip rootfs.img.gz rootfs.img || true

          # =========================================================================
          # LANGKAH 2: GUNAKAN VARIAN DROIDIAN CORE/MINIMAL (UKURAN RAMPING TARGET 500MB)
          # =========================================================================
          echo "Mengunduh Berkas Sistem Droidian Varian CORE API29 yang Jauh Lebih Ringan..."
          # Mengalihkan target unduhan ke varian rootfs-api29 minimal tanpa bloatware GUI berat
          aria2c -s 16 -x 16 -k 1M -o droidian_source.zip \
            "${H}${A}${B}/droidian-images/droidian/releases/download/droidian%2F101.20251130/droidian-OFFICIAL-core-rootfs-api29-arm64-101.20251130_20251207.zip"
          
          unzip -j droidian_source.zip "*.img" -d tmp_workspace/
          rm -f droidian_source.zip
          
          echo "Mengompresi sistem Droidian secara maksimal (.img.gz)..."
          gzip -9 tmp_workspace/rootfs.img
          
          # =========================================================================
          # LANGKAH 3: KOREKSI TOTAL UPDATER-SCRIPT (ANTI-ERROR DETEKSI TWRP)
          # =========================================================================
          echo "Menyusun skrip updater-script Edify hibrida bersih..."
          mkdir -p tmp_meta/META-INF/com/google/android
          cat << 'SCRIPT_EOF' > tmp_meta/META-INF/com/google/android/updater-script
          ui_print("========================================");
          ui_print("    DROIDIAN OS UBPORTS-HYBRID VINCE    ");
          ui_print("       COMPACT SLIM DATA LOOP METHOD    ");
          ui_print("========================================");
          
          ui_print("Unmounting block slots...");
          abort_if_no_match = "false";
          unmount("/data");
          unmount("/system");
          
          ui_print("1. Flashing compatible Halium boot image...");
          package_extract_file("halium-boot.img", "/dev/block/bootdevice/by-name/boot");
          
          ui_print("2. Formatting /data (UserData) partition to EXT4...");
          format("ext4", "EMMC", "/dev/block/by-name/userdata", "0", "/data");
          mount("ext4", "EMMC", "/dev/block/by-name/userdata", "/data");
          
          ui_print("3. Deploying Android Driver Container to /data/system.img...");
          package_extract_file("system.img.gz", "/data/system.img");
          
          ui_print("4. Deploying Droidian Debian Rootfs to /data/ubuntu.img...");
          package_extract_file("rootfs.img.gz", "/data/ubuntu.img");
          
          ui_print("Setting proper file execution permissions...");
          set_metadata("/data/system.img", "uid", 0, "gid", 0, "mode", 0644);
          set_metadata("/data/ubuntu.img", "uid", 0, "gid", 0, "mode", 0644);
          
          unmount("/data");
          ui_print("========================================");
          ui_print("    INSTALLATION COMPLETED SUCCESSFUL!  ");
          ui_print("========================================");
          SCRIPT_EOF
          
          # =========================================================================
          # LANGKAH 4: SUNTIK KEMBALI DENGAN TINGKAT KOMPRESI TERTINGGI (-9)
          # =========================================================================
          echo "Menyuntikkan pembaruan komponen baru dengan kompresi tingkat 9..."
          
          cd tmp_meta
          zip -9ur ../output/Droidian-Vince-Hybrid-Installer.zip META-INF/com/google/android/updater-script
          cd ..
          
          cd tmp_workspace
          zip -9ur ../output/Droidian-Vince-Hybrid-Installer.zip rootfs.img.gz
          cd ..
          
          rm -rf tmp_workspace tmp_meta
          echo "Proses re-packaging hibrida ramping selesai sempurna!"
      
      - name: Upload Finished Installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Droidian-Hybrid-ZIP-Vince
          path: output/
