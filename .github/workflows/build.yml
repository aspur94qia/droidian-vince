name: Build Genuine Droidian Rootfs for Vince
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static debootstrap arch-test git aria2 \
            zstd android-sdk-libsparse-utils e2fsprogs
      
      - name: Clone Droidian Developer Tools
        run: |
          H="https://"
          A="git"
          B="hub.com"
          git clone "${H}${A}${B}/droidian-releng/droidian-build-tools.git" tools
          
      - name: Build Authentic Droidian System Image
        run: |
          mkdir -p output
          
          # =========================================================================
          # PERBAIKAN JALUR DATA: Deteksi lokasi asli skrip pembangun rootfs Droidian
          # =========================================================================
          BUILD_SCRIPT=$(find tools/ -name "droidian-build-rootfs" | head -n 1)
          
          if [ -z "$BUILD_SCRIPT" ]; then
            echo "Skrip droidian-build-rootfs tidak ditemukan di dalam folder tools!" && exit 1
          fi
          
          echo "Skrip ditemukan di: $BUILD_SCRIPT"
          chmod +x $BUILD_SCRIPT
          
          # Eksekusi pembuatan rootfs Droidian (Debian Bookworm) murni menggunakan jalur asli
          sudo $BUILD_SCRIPT \
            --architecture arm64 \
            --distribution bookworm \
            --output output/droidian_gsi_vince.img \
            --size 2000M
          # =========================================================================
            
          # Memastikan file sistem berhasil dibuat dan bukan berukuran 0 bytes
          if [ ! -s output/droidian_gsi_vince.img ]; then
            echo "Gagal membangun Rootfs Droidian asli!" && exit 1
          fi
      
      - name: Upload Droidian System Image
        uses: actions/upload-artifact@v4
        with:
          name: Droidian-Rootfs-Vince
          path: output/
