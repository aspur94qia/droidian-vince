name: Build Vince Hemat
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/cache@v4
        id: tc-cache
        with:
          path: ~/tc
          key: tc-clang-r510928
      - name: Setup TC
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/tc && cd ~/tc
          wget -q https://android.googlesource.[STRIPPED 84 bytes].tar.gz -O clang.tar.gz
          mkdir clang && tar -xzf clang.tar.gz -C clang && rm clang.tar.gz
          git clone --depth=1 https://android.googlesource.[STRIPPED 68 bytes].9 aarch64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 arm32
      - name: Build
        run: |
          echo "$HOME/tc/clang/bin" >> $GITHUB_PATH
          echo "$HOME/tc/aarch64/bin" >> $GITHUB_PATH
          echo "$HOME/tc/arm32/bin" >> $GITHUB_PATH
          export PATH=$HOME/tc/clang/bin:$HOME/tc/aarch64/bin:$HOME/tc/arm32/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          sed -i 's/prepare-compiler-check:/_prepare-compiler-check:/g' Makefile || true
          make O=out ARCH=arm64 vince_defconfig
          echo "CONFIG_AUDIT=y" >> out/.config
          echo "CONFIG_AUDIT_GENERIC=y" >> out/.config
          echo "CONFIG_SECURITY=y" >> out/.config
          echo "CONFIG_SECURITYFS=y" >> out/.config
          echo "CONFIG_SECURITY_APPARMOR=y" >> out/.config
          echo "CONFIG_SECURITY_APPARMOR_BOOTPARAM_VALUE=1" >> out/.config
          echo "CONFIG_ANDROID_BINDERFS=y" >> out/.config
          make O=out ARCH=arm64 olddefconfig
          make -j2 O=out ARCH=arm64 CC=clang
      - uses: actions/upload-artifact@v4
        with:
          name: vince-Image
          path: out/arch/arm64/boot/Image.gz-dtb
          retention-days: 1
