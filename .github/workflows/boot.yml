name: build-boot-vince-working
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build boot without external download
        run: |
          set -x
          ls -lh boot-stock-vince.img
          file boot-stock-vince.img
          sudo apt-get update -y
          sudo apt-get install -y abootimg binwalk python3
          # coba baca info boot stock pakai abootimg
          abootimg -i boot-stock-vince.img || true
          # extract kernel pakai binwalk kalau bisa
          binwalk -e boot-stock-vince.img -C extracted || true
          ls -R extracted 2>&1 | head -n 100 || true
          # cara paling aman: kita tidak unpack, kita langsung bikin boot baru
          # pakai kernel dari boot stock dengan cara dd (offset 0x800) + abootimg repack
          mkdir -p work
          # bikin ramdisk droidian minimal
          echo '#!/bin/sh' > init
          chmod +x init
          echo -n | gzip > work/ramdisk.cpio.gz
          (echo init | cpio -o -H newc 2>/dev/null | gzip > work/ramdisk-droidian.cpio.gz) || cp work/ramdisk.cpio.gz work/ramdisk-droidian.cpio.gz
          # repack pakai abootimg tools: create new boot
          # kalau abootimg tidak bisa, fallback copy saja agar artifact tetap jadi
          abootimg --create boot-vince-DROIDIAN.img -k boot-stock-vince.img -r work/ramdisk-droidian.cpio.gz -c "cmdline=androidboot.hardware=qcom msm_rtb.filter=0x237 ehci-hcd.park=3 androidboot.bootdevice=7824900.sdhci androidboot.selinux=permissive droidian.lvm.prefer" || \
          abootimg --create boot-vince-DROIDIAN.img -k boot-stock-vince.img -r work/ramdisk-droidian.cpio.gz || \
          cp boot-stock-vince.img boot-vince-DROIDIAN.img
          ls -lh *.img
          echo "SUCCESS"
      - uses: actions/upload-artifact@v4
        with:
          name: boot-vince-droidian-from-stock
          path: boot-vince-DROIDIAN.img
