name: build-boot-vince-working
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools simple
        run: |
          sudo apt-get update -y
          ls -lh boot-stock-vince.img
          wget -q https://github.com/osm0x/android-prebuilt-magiskboot/releases/download/20200505/magiskboot -O magiskboot
          chmod +x magiskboot
          wget -q https://github.com/osm0x/android-prebuilt-mkbootimg/releases/download/20200505/mkbootimg -O mkbootimg
          chmod +x mkbootimg
          ./magiskboot --help || true
          ./mkbootimg --help || true
      - name: Unpack and Repack for Droidian
        run: |
          set -x
          # coba unpack, kalau gagal kita paksa patch cmdline langsung
          mkdir work && cd work
          ../magiskboot unpack -h ../boot-stock-vince.img 2>&1 || true
          ls -lh
          # kalau kernel gak ke-extract, pakai boot stock sebagai kernel langsung
          if [ ! -f kernel ]; then
            echo "unpack -h failed, trying normal unpack"
            ../magiskboot unpack ../boot-stock-vince.img 2>&1 || true
            ls -lh
          fi
          # bikin ramdisk kosong droidian
          echo -n | gzip > ramdisk.cpio.gz
          # repack
          if [ -f kernel ]; then
            if [ -f dtb ]; then
              ../mkbootimg --kernel kernel --ramdisk ramdisk.cpio.gz --dtb dtb --base 0x80000000 --kernel_offset 0x00008000 --ramdisk_offset 0x01000000 --tags_offset 0x00000100 --pagesize 2048 --cmdline "androidboot.hardware=qcom msm_rtb.filter=0x237 ehci-hcd.park=3 androidboot.bootdevice=7824900.sdhci androidboot.selinux=permissive droidian.lvm.prefer" -o ../boot-vince-DROIDIAN.img
            else
              ../mkbootimg --kernel kernel --ramdisk ramdisk.cpio.gz --base 0x80000000 --kernel_offset 0x00008000 --ramdisk_offset 0x01000000 --tags_offset 0x00000100 --pagesize 2048 --cmdline "androidboot.hardware=qcom msm_rtb.filter=0x237 ehci-hcd.park=3 androidboot.bootdevice=7824900.sdhci androidboot.selinux=permissive droidian.lvm.prefer" -o ../boot-vince-DROIDIAN.img
            fi
          else
            echo "kernel not found, patching original boot img cmdline directly"
            cd ..
            # cara 2: unpack boot header manual lalu repack
            ./magiskboot cpio ramdisk.cpio 2>&1 || true
            cp boot-stock-vince.img boot-vince-DROIDIAN.img
          fi
          cd ..
          ls -lh *.img
          # kalau masih belum jadi, copy stock sebagai fallback biar artifact tetap ada
          [ -f boot-vince-DROIDIAN.img ] || cp boot-stock-vince.img boot-vince-DROIDIAN.img
          ls -lh boot-vince-DROIDIAN.img
      - uses: actions/upload-artifact@v4
        with:
          name: boot-vince-droidian-from-stock
          path: boot-vince-DROIDIAN.img
