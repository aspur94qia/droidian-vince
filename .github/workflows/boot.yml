name: build-boot-vince-working
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget python3
      - name: Unpack stock boot.img
        run: |
          ls -lh boot-stock-vince.img
          wget -q https://github.com/osm0x/android-prebuilt-magiskboot/releases/download/20200505/magiskboot -O magiskboot
          chmod +x magiskboot
          mkdir unpack && cd unpack
          ../magiskboot unpack ../boot-stock-vince.img
          ls -lh
          echo "--- cmdline asli ---"
          cat header || true
          cat cmdline 2>/dev/null || strings boot.img | head
      - name: Repack for Droidian
        run: |
          cd unpack
          # ambil kernel & dtb dari stock kamu, cuma ganti cmdline buat Droidian
          wget -q https://github.com/osm0x/android-prebuilt-mkbootimg/releases/download/20200505/mkbootimg -O mkbootimg
          chmod +x mkbootimg
          # backup cmdline ori
          cp -f ../boot-stock-vince.img ../boot-stock-backup.img || true
          # repack pakai kernel stock + ramdisk droidian (kosong dulu biar boot)
          echo -n | gzip > ramdisk-droidian.cpio.gz
          ./mkbootimg --kernel kernel --ramdisk ramdisk-droidian.cpio.gz --base 0x80000000 --kernel_offset 0x00008000 --ramdisk_offset 0x01000000 --tags_offset 0x00000100 --pagesize 2048 --cmdline "androidboot.hardware=qcom msm_rtb.filter=0x237 ehci-hcd.park=3 androidboot.bootdevice=7824900.sdhci androidboot.selinux=permissive droidian.lvm.prefer" -o ../boot-vince-DROIDIAN-from-stock.img || \
          ../magiskboot repack ../boot-stock-vince.img ../boot-vince-DROIDIAN-from-stock.img
          ls -lh ../boot-vince*.img
          cd ..
          ls -lh *.img
      - uses: actions/upload-artifact@v4
        with:
          name: boot-vince-droidian-from-stock
          path: boot-vince-DROIDIAN-from-stock.img
