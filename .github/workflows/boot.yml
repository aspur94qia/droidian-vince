name: build-boot-vince-working
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
      - name: Clone kernel
        run: |
          rm -rf kernel
          git clone --depth 1 https://github.com/vatva691/android_kernel_xiaomi_msm8953-4.9 kernel
          cd kernel
          rm -rf net/wireguard
          sed -i '/wireguard/d' net/Kconfig || true
          mkdir -p net/wireguard
          echo "# dummy" > net/wireguard/Kconfig
          sed -i 's/YYLTYPE yylloc/extern YYLTYPE yylloc/' scripts/dtc/dtc-lexer.lex.c_shipped || true
          cat arch/arm64/configs/vince-perf_defconfig > arch/arm64/configs/droidian_defconfig
          cat >> arch/arm64/configs/droidian_defconfig <<'EOF'
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_VT=y
          CONFIG_NAMESPACES=y
          CONFIG_CGROUPS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_FHANDLE=y
          CONFIG_SECCOMP=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_WIREGUARD=n
          CONFIG_DEBUG_INFO=n
          EOF
          cd ..
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- droidian_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j4 Image.gz dtbs
          cat arch/arm64/boot/Image.gz arch/arm64/boot/dts/qcom/msm8953-vince*.dtb > ../Image.gz-dtb
          ls -lh ../Image.gz-dtb
      - name: Make boot.img
        run: |
          echo -n | gzip > ramdisk.cpio.gz
          wget -q https://github.com/osm0x/android-prebuilt-mkbootimg/releases/download/20200505/mkbootimg -O mkbootimg
          chmod +x mkbootimg
          ./mkbootimg --kernel Image.gz-dtb --ramdisk ramdisk.cpio.gz --base 0x80000000 --kernel_offset 0x00008000 --ramdisk_offset 0x01000000 --tags_offset 0x00000100 --pagesize 2048 --cmdline "androidboot.hardware=qcom msm_rtb.filter=0x237 ehci-hcd.park=3 androidboot.bootdevice=7824900.sdhci androidboot.selinux=permissive droidian.lvm.prefer" -o boot-vince-A13-droidian.img
      - uses: actions/upload-artifact@v4
        with:
          name: boot-working-vince
          path: boot-vince-A13-droidian.img
