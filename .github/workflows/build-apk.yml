name: Build aspflash Premium APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          
      # Merakit dummy wrapper gradle versi stabil untuk build sistem Android
      - name: Create Local Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5
        
      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew
        
      - name: Build Debug APK via Gradle Compiler
        run: ./gradlew assembleDebug
        
      - name: Upload Output APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aspflash-NoAds-ReleaseAPK
          path: app/build/outputs/apk/debug/app-debug.apk
